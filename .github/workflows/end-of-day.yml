# End of day: fills the model account, reruns the model, sets orders, scores news, runs Kronos, sends Telegram.
# Replaces the older End of day workflow (delete that file if it has another name).
name: End of day
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 17:30 WIB
    - cron: "0 12 * * 1-5"    # 19:00 WIB retry (prices sometimes publish late)
  workflow_dispatch:
    inputs:
      resend:
        description: "Resend the last note even if this session was already processed"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bot-data
  cancel-in-progress: false
jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the Kronos model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-weights-v1
      - name: Install (CPU-only PyTorch, about 200 MB)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run the end-of-day job
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # unset repository variables arrive as "", so defaults are given here too
          START_CASH: ${{ vars.START_CASH || '100000000' }}
          KRONOS: ${{ vars.KRONOS || 'on' }}             # set the variable to "off" to skip Kronos
          KRONOS_PATHS: ${{ vars.KRONOS_PATHS || '16' }}  # sampled paths per name
          KRONOS_NAMES: ${{ vars.KRONOS_NAMES || 'watch' }} # "watch" or "all" 30 stocks
        run: python -m bot.tasks eod ${{ inputs.resend && '--force' || '' }}
      - name: Save results to the dashboard
        run: |
          git config user.name "idx-trend-bot"
          git config user.email "idx-trend-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "End of day $(date -u +%F)"
          git pull --rebase origin main || true
          git push
