# Seed (or reset) the model account from your real holdings, then run the end-of-day job on it.
# Actions -> Seed account -> Run workflow. Positions: "BBCA 43 6562, BMRI 66 4956" (symbol, lots, average price).
name: Seed account
on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Holdings: SYMBOL LOTS AVERAGE_PRICE, comma-separated"
        required: true
      cash:
        description: "Free cash in the account (rupiah)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: bot-data
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch for Kronos)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Seed and run the end-of-day job
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KRONOS: ${{ vars.KRONOS }}
        run: |
          python -m bot.tasks seed --positions "${{ inputs.positions }}" --cash "${{ inputs.cash }}"
          python -m bot.tasks eod --force
      - name: Save to the dashboard
        run: |
          git config user.name "idx-trend-bot"
          git config user.email "idx-trend-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Seed account $(date -u +%F)"
          git pull --rebase origin main || true
          git push
