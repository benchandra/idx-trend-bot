name: End of day
on:
  schedule:
    - cron: '30 10 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
concurrency:
  group: idx-bot-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    if: vars.RUNNER != 'vm'   # set Variable RUNNER=vm when the always-on box runs the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      START_CASH: ${{ vars.START_CASH }}
      APPROVAL_MODE: ${{ vars.APPROVAL_MODE }}
      BROKER: ${{ vars.BROKER }}
      BROKER_FEES: ${{ vars.BROKER_FEES }}
      RULES: ${{ vars.RULES }}
      COMMITTEE: ${{ vars.COMMITTEE }}
      COMMITTEE_MODEL: ${{ vars.COMMITTEE_MODEL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the job
        run: python -m bot.tasks eod
      - name: Save the results to the repository
        run: |
          git config user.name "idx-trend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "End of day: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
